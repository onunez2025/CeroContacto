services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      PORT: "3000"
      C4C_BASE_URL: ${C4C_BASE_URL}
      C4C_USER: ${C4C_USER}
      C4C_PASSWORD: ${C4C_PASSWORD}
      SQL_SERVER: ${SQL_SERVER}
      SQL_DATABASE: ${SQL_DATABASE}
      SQL_USER: ${SQL_USER}
      SQL_PASSWORD: ${SQL_PASSWORD}
      SQL_PASSWORD_B64: ${SQL_PASSWORD_B64}
      SQL_ENCRYPT: ${SQL_ENCRYPT:-true}
      C4C_CATALOG_BASE_URL: ${C4C_CATALOG_BASE_URL}
      C4C_CATALOG_USER: ${C4C_CATALOG_USER}
      C4C_CATALOG_PASSWORD: ${C4C_CATALOG_PASSWORD}
      # Correo de confirmacion via Microsoft Graph. Faltaban aca desde que se
      # agrego el mailer (2026-08-11): compose solo inyecta al contenedor las
      # variables que declara, asi que readGraphConfig() no las encontraba y
      # el correo NUNCA se envio desde produccion, en silencio.
      MS_GRAPH_TENANT_ID: ${MS_GRAPH_TENANT_ID}
      MS_GRAPH_CLIENT_ID: ${MS_GRAPH_CLIENT_ID}
      MS_GRAPH_CLIENT_SECRET: ${MS_GRAPH_CLIENT_SECRET}
      MS_GRAPH_SENDER_EMAIL: ${MS_GRAPH_SENDER_EMAIL}
      # Base publica para el banner del correo; sin esto el correo sale sin imagen.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      # "production" (en ingles) es la clave que espera ENV_FILES en env.ts;
      # con cualquier otro valor cae al default ".env.local".
      APP_ENV: ${APP_ENV:-production}

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    # Sin "ports:" - Dokploy/Traefik ya ocupa 80/443 en el host y enruta por
    # la red interna de Docker usando el Container Port configurado en la
    # pestaña Domains (80, el puerto donde escucha nginx dentro del contenedor).
    depends_on:
      - backend
