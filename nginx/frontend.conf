server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # El backend Express escucha en el puerto 3000 dentro del servicio
    # "backend" del docker-compose - mismo origen para el navegador, sin CORS.
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # La creacion de tickets puede tardar varios minutos en produccion
        # para clientes con historial (ver C4CODataClient.timeoutMs = 5min).
        # El default de nginx (60s) cortaria la conexion mucho antes.
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /health {
        proxy_pass http://backend:3000/health;
    }

    # Los assets llevan un hash en el nombre (index-Bx1G6LQE.js): cambian de
    # nombre en cada build, asi que se pueden cachear para siempre sin riesgo
    # de servir uno viejo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # El index.html NO se cachea: es el que dice que bundle cargar. Sin esta
    # cabecera nginx no manda ningun Cache-Control y el navegador aplica cache
    # heuristico sobre Last-Modified, quedandose con el HTML viejo - que apunta
    # al bundle viejo. Efecto real (2026-08-18): tras desplegar el mapa, el
    # formulario seguia sin mostrarlo para quien ya habia visitado el sitio,
    # aunque el bundle desplegado si lo tenia. Pesa menos de 1 KB, revalidarlo
    # en cada visita no cuesta nada.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri /index.html;
    }
}
