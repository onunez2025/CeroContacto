server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # El backend Express escucha en el puerto 3000 dentro del servicio
    # "backend" del docker-compose - mismo origen para el navegador, sin CORS.
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # La creacion de tickets puede tardar varios minutos en produccion
        # para clientes con historial (ver C4CODataClient.timeoutMs = 5min).
        # El default de nginx (60s) cortaria la conexion mucho antes.
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /health {
        proxy_pass http://backend:3000/health;
    }

    location / {
        try_files $uri /index.html;
    }
}
